services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: pgs_local
      POSTGRES_USER: pgs_local
      POSTGRES_PASSWORD: ${PGS_LOCAL_DB_PASSWORD:?Set a disposable local password}
    ports: ["127.0.0.1:55432:5432"]
    volumes: [pgs_phase2_metadata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgs_local -d pgs_local"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  pgs_phase2_metadata: